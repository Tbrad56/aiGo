[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aigo"
version = "0.1.0"
description = "Personal iPhone location simulator built on pymobiledevice3"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pymobiledevice3>=11.50",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pystray>=0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
aigo = "aigo.__main__:main"

[tool.setuptools.packages.find]
include = ["aigo*"]

[tool.setuptools.package-data]
aigo = ["static/*", "static/js/*", "static/fonts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
